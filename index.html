<!-- ============================================================
     Política de Segurança de Conteúdo
     Tudo vem da própria origem. Nenhum script externo, nenhuma
     CDN, nenhuma fonte remota. Scripts inline são proibidos —
     é a defesa central contra XSS.
     ============================================================ -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: blob:;
  font-src 'self';
  connect-src 'self';
  media-src 'self' blob:;
  worker-src 'self';
  manifest-src 'self';
  object-src 'none';
  base-uri 'none';
  form-action 'none';
  frame-src 'none';
  upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">

<!-- ============================================================
     Cabeçalho
     ============================================================ -->
<header class="app-header dark-surface">
  <button type="button" class="brand" data-nav="inicio" aria-label="Totali · voltar para o início">
    <img class="brand__logo" src="assets/totali-logo-branca.png" alt="Totali Soluções Contábeis" width="730" height="277">
    <span class="brand__divider" aria-hidden="true"></span>
    <span class="brand__text">
      <span class="brand__title" id="brandTitulo">Portal do Cliente</span>
      <span class="brand__sub" id="brandSub">Onboarding</span>
    </span>
  </button>

  <div class="header-actions">
    <button type="button" class="hbtn hbtn--gold" id="btnInstalar" hidden>
      <svg class="ic" aria-hidden="true"><use href="#ic-download"></use></svg>
      <span class="hbtn__label">Instalar</span>
    </button>
    <button type="button" class="hbtn" data-nav="ajuda" aria-label="Ajuda">
      <svg class="ic" aria-hidden="true"><use href="#ic-help"></use></svg>
      <span class="hbtn__label">Ajuda</span>
    </button>
  </div>
</header>

<!-- ============================================================
     Corpo
     ============================================================ -->
<div class="shell">

  <nav class="sidenav" aria-label="Navegação principal">
    <div class="sidenav__label">Menu</div>

    <button type="button" class="sidenav__item" data-nav="inicio">
      <svg class="ic" aria-hidden="true"><use href="#ic-home"></use></svg>Início
    </button>
    <button type="button" class="sidenav__item" data-nav="documentos">
      <svg class="ic" aria-hidden="true"><use href="#ic-folder"></use></svg>Documentos
      <span class="sidenav__badge" data-badge-pendentes hidden></span>
    </button>
    <button type="button" class="sidenav__item" data-nav="mensagens">
      <svg class="ic" aria-hidden="true"><use href="#ic-chat"></use></svg>Mensagens
      <span class="sidenav__badge" data-badge-mensagens hidden></span>
    </button>
    <button type="button" class="sidenav__item" data-nav="academy">
      <svg class="ic" aria-hidden="true"><use href="#ic-play"></use></svg>Academy
    </button>
    <button type="button" class="sidenav__item" data-nav="empresa">
      <svg class="ic" aria-hidden="true"><use href="#ic-building"></use></svg>Empresa
    </button>
    <button type="button" class="sidenav__item" data-nav="ajuda">
      <svg class="ic" aria-hidden="true"><use href="#ic-help"></use></svg>Ajuda
    </button>

    <div class="sidenav__card">
      <div class="t">Alguma dúvida?</div>
      <div class="d">Nossa equipe acompanha sua migração do começo ao fim.</div>
      <a class="btn btn--gold btn--sm" style="margin-top:12px;width:100%"
         href="https://wa.me/5579998412107" target="_blank" rel="noopener noreferrer">
        <svg class="ic" aria-hidden="true"><use href="#ic-phone"></use></svg>Falar no WhatsApp
      </a>
    </div>
  </nav>

  <main class="main">
    <div id="view" class="view" tabindex="-1">
      <div class="card card--pad">
        <p class="text-sm text-muted">Carregando o portal…</p>
      </div>
    </div>

    <noscript>
      <div class="card card--pad" style="margin-top:16px">
        <p style="font-size:14px;line-height:1.6">
          Este portal precisa de JavaScript ativado para funcionar. Ative o JavaScript nas
          configurações do seu navegador ou fale com a Totali pelo WhatsApp (79) 99841-2107.
        </p>
      </div>
    </noscript>
  </main>
</div>

     Barra inferior (celular)
     ============================================================ -->
<nav class="tabbar" aria-label="Navegação principal">

  <button type="button" class="tabbar__item" data-nav="documentos">
    <svg class="ic" aria-hidden="true"><use href="#ic-folder"></use></svg>Documentos

  <button type="button" class="tabbar__item" data-nav="mensagens">
    <svg class="ic" aria-hidden="true"><use href="#ic-chat"></use></svg>Mensagens
    <span class="tabbar__badge" data-badge-mensagens hidden></span>
  </button>
  <button type="button" class="tabbar__item" data-nav="academy">

  </button>
  <button type="button" class="tabbar__item" data-nav="ajuda">
    <svg class="ic" aria-hidden="true"><use href="#ic-help"></use></svg>Ajuda
  </button>
</nav>
