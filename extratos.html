<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- ============================================================
     Política de Segurança de Conteúdo

     Mais fechada que a do portal, e de propósito: esta página abre
     SEM login, então é a que mais gente estranha vai acessar. Ela
     não tem vídeo e não envia formulário — então `media-src` e
     `form-action` ficam em 'none'.

     O que ela precisa é ler dois documentos do Firestore e falar
     com o App Check. Os links do Ottimizza e o PDF do manual não
     entram aqui: abrir uma aba nova é navegação, não requisição, e
     navegação a CSP não governa.

     `frame-src` FICOU ABERTO para o google.com, e não é descuido.
     O reCAPTCHA do App Check roda num iframe de lá; com 'none' ele
     é bloqueado, o App Check nunca pega token e, com a verificação
     exigida, a página não lê nada — falhando igualzinho a um link
     inválido, sem dizer por quê. Foi assim que apareceu: a página
     publicada abria dizendo "este link não abre", e o console
     mostrava o bloqueio do iframe.
     ============================================================ -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' https://www.google.com https://www.gstatic.com;
  style-src 'self' 'unsafe-inline';
  img-src 'self' data:;
  font-src 'self';
  connect-src 'self'
    https://firestore.googleapis.com
    https://firebaseappcheck.googleapis.com
    https://content-firebaseappcheck.googleapis.com
    https://www.google.com;
  media-src 'none';
  object-src 'none';
  base-uri 'none';
  form-action 'none';
  frame-src https://www.google.com;
  upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">

<title>Liberar o acesso ao extrato · Totali</title>
<meta name="description" content="Autorize o compartilhamento do extrato da sua empresa com a Totali Soluções Contábeis.">
<meta name="robots" content="noindex, nofollow">

<meta name="theme-color" content="#0d1926">
<meta name="color-scheme" content="dark">

<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">

<style>
  /* Só o que o design system não tem: esta página não é uma tela
     do portal, é uma página avulsa, e precisa do próprio topo. */
  .ext-topo{
    display:flex; align-items:center; gap:12px;
    padding:18px 16px 0;
    padding-left:max(16px,env(safe-area-inset-left));
    padding-right:max(16px,env(safe-area-inset-right));
    max-width:var(--maxw); margin:0 auto;
  }
  .ext-topo img{height:30px;width:auto}
  .ext-wrap{max-width:var(--maxw);margin:0 auto}

  /* Um banco por linha. O cartão do design system já dá a moldura;
     aqui só arrumamos o miolo. */
  /* O design system não tem tamanho base para `.ic` — cada contexto
     dá o seu (`.btn .ic`, `.orienta__t .ic`…). Sem isto, o ícone do
     cartão nasce do tamanho do container. */
  .ext-aviso .ic,
  .ext-banco__topo .ic{width:20px;height:20px;flex:none}

  .ext-banco{display:flex;flex-direction:column;gap:12px}
  .ext-banco__topo{display:flex;align-items:center;gap:10px}
  .ext-banco__nome{font-size:15px;font-weight:640;color:var(--txt);flex:1}
  .ext-banco__acoes{display:flex;flex-wrap:wrap;gap:9px}
  .ext-banco__acoes .btn{flex:1 1 170px}

  /* Passo a passo numerado, na tela e no modal. */
  .ext-passos{margin:0;padding:0;list-style:none;counter-reset:p}
  .ext-passos li{
    position:relative;padding-left:34px;margin-bottom:12px;
    font-size:13.5px;line-height:1.6;color:var(--txt-2);
  }
  .ext-passos li:last-child{margin-bottom:0}
  .ext-passos li::before{
    counter-increment:p;content:counter(p);
    position:absolute;left:0;top:-1px;
    width:23px;height:23px;border-radius:50%;
    background:var(--glass);border:1px solid var(--stroke-2);
    color:var(--gold);font-size:12px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .ext-rodape{
    text-align:center;font-size:12px;color:var(--txt-4);
    padding:26px 16px calc(26px + env(safe-area-inset-bottom));
  }
</style>
</head>
